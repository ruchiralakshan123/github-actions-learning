name: Build and Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'sample-app/**'
      - '.github/workflows/build-test.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 18.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'sample-app/package.json'

      - name: Install dependencies
        working-directory: ./sample-app
        run: npm install

      - name: Run linter
        working-directory: ./sample-app
        run: npm run lint --if-present
        continue-on-error: true

      - name: Build application
        working-directory: ./sample-app
        run: npm run build --if-present

      - name: Run tests
        working-directory: ./sample-app
        run: npm test

      # ⭐ TASK 8 - CREATE ARTIFACT FILE
      - name: Create artifact file (Task 8)
        working-directory: ./sample-app
        run: echo "Advanced Task 8 Build Output" > output.txt

      # ⭐ TASK 8 - UPLOAD ARTIFACT
      - name: Upload Task 8 artifact
        uses: actions/upload-artifact@v4
        with:
          name: task8-build-output
          path: sample-app/output.txt
          retention-days: 30

      - name: Check coverage
        if: always()
        working-directory: ./sample-app
        run: |
          if [ -d coverage ]; then
            echo "✅ Coverage report generated"
          else
            echo "⚠️ No coverage report found"
          fi

  lint-check:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'sample-app/package.json'

      - working-directory: ./sample-app
        run: npm install

      - name: Run ESLint
        working-directory: ./sample-app
        run: npm run lint --if-present
        continue-on-error: true

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: always()

    steps:
      - name: Print test results
        run: |
          echo "🎯 Test Run Summary"
          echo "==================="
          echo "✅ All tests completed"

  # ⭐ TASK 9 - CONDITIONAL DEPLOYMENT JOB
  deploy:
    name: Deploy Application
    needs: [build-and-test, lint-check]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Deploy Application Step
        run: |
          echo "🚀 Deploying application to production server..."
          echo "Deployment completed successfully!"